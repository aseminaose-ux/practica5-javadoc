name: Despliegue Automatizado de Javadoc

on:
  push:
    branches:
      - main

# Darle los permisos necesarios para publicar en GitHub
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-javadoc:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar entorno JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generar Javadoc
        run: |
          mkdir -p doc-output
          javadoc -d doc-output -sourcepath proyecto/src -subpackages .

      - name: Empaquetar artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc-output

  deploy-javadoc:
    needs: build-javadoc
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
